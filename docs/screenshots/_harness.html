<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentence Manager — synthetic screenshot fixture</title>
<style>
html,body{margin:0;padding:0;font-family:system-ui,sans-serif}body{padding:24px;background:#f4f5f7;color:#17212f}body.dark{background:#111318;color:#e5e7eb}.fixture-note{margin:0 0 16px;font-size:14px;max-width:1200px}ha-sentence-manager{display:block;width:900px;max-width:100%;--card-background-color:#fff;--primary-background-color:#f4f5f7}body.dark ha-sentence-manager{--card-background-color:#1c1e26;--primary-background-color:#111318}
</style>
<p class="fixture-note">Synthetic demonstration data for screenshots. Use the card controls to browse or import sentences and review reports. No Home Assistant connection, disk writes or device actions.</p>
<ha-sentence-manager id="card"></ha-sentence-manager>
<script src="../../custom_components/ha_sentence_manager/www/ha-sentence-manager.js"></script>
<script>
(() => {
  const params=new URLSearchParams(location.search),language=params.get('lang')==='pl'?'pl':'en',dark=params.get('theme')==='dark';
  document.documentElement.lang=language;document.body.classList.toggle('dark',dark);
  const card=document.getElementById('card'),width=Number(params.get('width'));
  if([320,390,500,900].includes(width))card.style.width=width+'px';
  let serial=0;
  const definitions=[
    {intent:'HassLightSet',en:['Set {area} brightness to {level} percent','Make the {area} lights brighter'],pl:['Ustaw jasność w {area} na {level} procent','Rozjaśnij światło w {area}'],slots:{area:'string',level:'number'},response:'default'},
    {intent:'HassClimateSetTemperature',en:['Set the temperature to {degrees} degrees in {room}'],pl:['Ustaw temperaturę na {degrees} stopni w {room}'],slots:{degrees:'number',room:'string'},response:''},
    {intent:'HassMediaPause',en:['Pause the music','Stop playback'],pl:['Wstrzymaj muzykę','Zatrzymaj odtwarzanie'],slots:{},response:''}
  ];
  let rows=definitions.map((row,index)=>({id:'synthetic-'+index,revision:'synthetic-revision-1',language,intent:row.intent,sentences:row[language],slots:row.slots,response:row.response}));
  const admin=params.get('role')!=='household';
  const hass={language,user:{id:admin?'synthetic-admin':'synthetic-household',is_admin:admin},themes:{darkMode:dark},states:{},config:{language,components:['ha_sentence_manager'],version:'2026.9.4'},services:{conversation:{reload:{},process:{}}},connection:{connected:true,subscribeEvents:async()=>()=>{}},
    callWS:async message=>{
      if(message.type==='ha_sentence_manager/list')return structuredClone(rows.filter(row=>!message.language||row.language===message.language));
      if(message.type==='conversation/process')return null; // Deliberately unconfirmed, never simulated success.
      if(!admin)throw Error('unauthorized');
      if(message.type==='ha_sentence_manager/create'){
        if(!message.intent||/[\/]/.test(message.intent))throw Error('invalid_payload: Invalid sentence');
        const id='synthetic-created-'+(++serial);
        rows.push({id,revision:'synthetic-revision-1',language:message.language,intent:message.intent,sentences:message.sentences,slots:message.slots||{},response:message.response||''});return {id};
      }
      if(message.type==='ha_sentence_manager/update'){
        const row=rows.find(row=>row.id===message.sentence_id);
        if(!row||row.revision!==message.revision)throw Error('conflict');
        Object.assign(row,message.patch,{revision:'synthetic-revision-'+(++serial+1)});return {ok:true};
      }
      if(message.type==='ha_sentence_manager/delete'){
        const row=rows.find(row=>row.id===message.sentence_id);
        if(!row||row.revision!==message.revision)throw Error('conflict');
        rows=rows.filter(row=>row!==rows.find(row=>row.id===message.sentence_id));return {ok:true};
      }
      if(message.type==='ha_sentence_manager/reload')return {ok:true};
      throw Error('No network actions in screenshot fixture');
    },callApi:async()=>{throw Error('No network actions in screenshot fixture');},callService:async()=>{throw Error('No device actions in screenshot fixture');}
  };
  card.setConfig({type:'custom:ha-sentence-manager',title:params.get('long')==='1'?'Sentence Manager — synthetic long card title for narrow columns and keyboard review':'Sentence Manager',language,show_support:false});card.hass=hass;
})();
</script>
</html>
